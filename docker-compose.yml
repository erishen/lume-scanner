# lume-scanner — Docker 编排
#
# 跑「二期 lume-core 量化内建 + Lume 现算指标」的 A 股信号扫描仪表盘,
# 只读挂载 stock-analyzer 全量 8.5M 行双库, 不写宿主数据。
#
# 两步构建(基座需先 build, 因 app 镜像 FROM 它):
#   cd work/lume
#   docker build -f lume/Dockerfile.scanner -t erishen/lume-scanner-base lume/
#   docker build -f lume-scanner/Dockerfile -t erishen/lume-scanner lume-scanner/
# 然后:
#   cd lume-scanner && docker compose up -d
# 或一条命令: cd work/lume/lume-scanner && make docker
#
# 数据: 真实双库经 ${STOCKANALYZER_DATA} 只读挂载进 /app/data;
#       SCANNER_DB/ASSET_DB 指向其中。默认 .data(中性样例目录, 无本机路径);
#       本机生产/开发在 gitignored 的 .env 里设 STOCKANALYZER_DATA 指向真实
#       stock-analyzer/data (路径含用户名, 故不进仓库, 见 .env.example)。

services:
  lume-scanner:
    image: erishen/lume-scanner
    container_name: lume-scanner
    restart: unless-stopped
    ports:
      # 默认仅本机(127.0.0.1) — 容器内 Lume 绑 0.0.0.0 + 无 HTPASSWD, 若映射到
      # 宿主 0.0.0.0 则局域网任何设备可匿名读全市场数据并消耗 LLM key 额度。
      # 需局域网/外网共享时显式 PORT=0.0.0.0:18094 make docker-up 并配合 HTPASSWD_FILE。
      - "127.0.0.1:${PORT:-18094}:8094"
    # 真实全量库只读挂载 (OrbStack/FUSE 原生, DELETE journal 无 -wal/-shm, ro 安全)
    # 默认指向中性样例目录 .data (不暴露本机绝对路径, 分享仓库无 PII);
    # 本机生产/开发在 gitignored 的 .env 里设 STOCKANALYZER_DATA 指向真实 stock-analyzer/data。
    volumes:
      - ${STOCKANALYZER_DATA:-.data}:/app/data:ro
      # 前端 bundle 走宿主实时文件(改 app.tsx → make ui 即生效, 无需重建镜像);
      # 镜像内置 www/ 仅作无挂载时的 fallback。
      - ./www:/app/www:ro
    environment:
      LUME_BIND: "0.0.0.0"          # 容器对外
      LUME_PORT: "8094"
      # 数据源: 指向挂载进来的全量双库; 留空则 repo.lume 回退内置样例 .data
      SCANNER_DB: /app/data/stock_analysis.db
      ASSET_DB: /app/data/asset_snapshot.db
      # 模拟仓: stock-analyzer 每日自动交易落盘的 paper_portfolio.json(只读挂载进 /app/data)
      PAPER_PORTFOLIO: /app/data/paper_portfolio.json
      # agent 工具白名单(同宿主 make real 的 SCANNER_TOOLS)
      HARNESS_TOOLS_ALLOW: scan_signals,screen_stocks,stock_kline,stock_indicators,realtime_quote,market_indexes,signal_stats,daily_picks,paper_portfolio,data_freshness,sql_query,sql_tables,sql_schema,read_file,get_time
      # AI 聊天: 容器内经 host.docker.internal 回连宿主 LLM 网关(tsm-hub:19070)。
      # 注意: LLM_API_URL 必须显式写容器视角 —— docker compose 会自动读本目录 .env
      # 做插值, .env 里的 localhost:19070 在容器内指向容器自身, 会导致上游 502。
      # 不设 LLM_API_KEY 则聊天页走离线 demo 引擎(教学, 无需凭据)。
      LLM_API_URL: "http://host.docker.internal:19070/v1/chat/completions"
      LLM_MODEL: ${LLM_MODEL:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "4", "http://127.0.0.1:8094/api/meta"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
