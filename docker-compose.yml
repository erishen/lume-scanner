# lume-scanner — Docker 编排
#
# 跑「二期 lume-core 量化内建 + Lume 现算指标」的 A 股信号扫描仪表盘,
# 只读挂载 stock-analyzer 全量 8.5M 行双库, 不写宿主数据。
#
# 两步构建(基座需先 build, 因 app 镜像 FROM 它):
#   cd work/lume
#   docker build -f lume/Dockerfile.scanner -t erishen/lume-scanner-base lume/
#   docker build -f lume-scanner/Dockerfile -t erishen/lume-scanner lume-scanner/
# 然后:
#   cd lume-scanner && docker compose up -d
# 或一条命令: cd work/lume/lume-scanner && make docker
#
# 数据: 真实双库经 ${STOCKANALYZER_DATA} 只读挂载进 /app/data;
#       SCANNER_DB/ASSET_DB 指向其中。默认 .data(中性样例目录, 无本机路径);
#       本机生产/开发在 gitignored 的 .env 里设 STOCKANALYZER_DATA 指向真实
#       stock-analyzer/data (路径含用户名, 故不进仓库, 见 .env.example)。

services:
  lume-scanner:
    image: erishen/lume-scanner
    container_name: lume-scanner
    restart: unless-stopped
    ports:
      # 默认仅本机(127.0.0.1) — 容器内 Lume 绑 0.0.0.0 + 无 HTPASSWD, 若映射到
      # 宿主 0.0.0.0 则局域网任何设备可匿名读全市场数据并消耗 LLM key 额度。
      # 需局域网/外网共享时显式 PORT=0.0.0.0:18094 make docker-up 并配合 HTPASSWD_FILE。
      - "127.0.0.1:${PORT:-18094}:8094"
    # 真实全量库只读挂载 (OrbStack/FUSE 原生, DELETE journal 无 -wal/-shm, ro 安全)
    # 默认指向中性样例目录 .data (不暴露本机绝对路径, 分享仓库无 PII);
    # 本机生产/开发在 gitignored 的 .env 里设 STOCKANALYZER_DATA 指向真实 stock-analyzer/data。
    volumes:
      - ${STOCKANALYZER_DATA:-.data}:/app/data:ro
      # 前端 bundle 走宿主实时文件(改 app.tsx → make ui 即生效, 无需重建镜像);
      # 镜像内置 www/ 仅作无挂载时的 fallback。
      - ./www:/app/www:ro
      # 技能目录: 容器以 uid 10001 运行, /app 属 root 不可写, 而 Lume 启动时
      # router 同步会把技能写到 cwd/skills/router/<name>/SKILL.md(mkdir 失败即
      # 静默跳过, 日志仍报 synced)。故需要一个可写落点。
      # 只挂 weekly-investment 这一级(而非整个 skills/): 其余 4 个共享技能
      # (code-review / rust-review / hot-news-post / post-comment, 后两个带写能力)
      # 在容器内根本不可见。配合 sync 期按白名单裁剪, 形成两层约束:
      # 白名单被误设为空时, 磁盘上也没有别的技能可暴露。
      - ./skills/router/weekly-investment:/app/skills/router/weekly-investment
    environment:
      LUME_BIND: "0.0.0.0"          # 容器对外
      LUME_PORT: "8094"
      # 数据源: 指向挂载进来的全量双库; 留空则 repo.lume 回退内置样例 .data
      SCANNER_DB: /app/data/stock_analysis.db
      ASSET_DB: /app/data/asset_snapshot.db
      # 模拟仓: stock-analyzer 每日自动交易落盘的 paper_portfolio.json(只读挂载进 /app/data)
      PAPER_PORTFOLIO: /app/data/paper_portfolio.json
      # agent 原生 SQL 工具(sql_query/sql_tables/sql_schema)只在设置了 SQLITE_DB
      # 时注册(见 agent-httpd/src/agent/sqlite_tool.c: sqlite_tools_init)。
      # 主库选 stock_analysis(845M+ 行, 业务核心); 只读挂载 + 连接以
      # SQLITE_OPEN_READONLY 打开, SELECT-only, 物理上无法写。
      # 另一份 asset_snapshot.db 可在 sql_query 里 ATTACH 后访问。
      SQLITE_DB: /app/data/stock_analysis.db
      # agent 工具白名单(同宿主 make real 的 SCANNER_TOOLS)
      HARNESS_TOOLS_ALLOW: scan_signals,screen_stocks,stock_kline,stock_indicators,realtime_quote,market_indexes,signal_stats,daily_picks,paper_portfolio,data_freshness,sql_query,sql_tables,sql_schema,read_file,get_time
      # agent 技能白名单: 只保留投资周报, 屏蔽 router 同步下来的代码/社媒等无关/写型共享技能
      # (不设则 agent-httpd 默认暴露全部; 空字符串仍=放行全部, 故用 weekly-investment 显式指定)
      HARNESS_SKILLS_ALLOW: ${HARNESS_SKILLS_ALLOW:-weekly-investment}
      # AI 聊天: 容器内经 host.docker.internal 回连宿主 LLM 网关(tsm-hub:19070)。
      # 注意: LLM_API_URL 必须显式写容器视角 —— docker compose 会自动读本目录 .env
      # 做插值, .env 里的 localhost:19070 在容器内指向容器自身, 会导致上游 502。
      # 不设 LLM_API_KEY 则聊天页走离线 demo 引擎(教学, 无需凭据)。
      LLM_API_URL: "http://host.docker.internal:19070/v1/chat/completions"
      LLM_MODEL: ${LLM_MODEL:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "4", "http://127.0.0.1:8094/api/meta"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---- peer 节点(局域网互通) ----
  # 独立容器: peer 是另一个 server{}(不同端口、不同信任边界)。
  #
  # 是否启动由 **.env 决定**, 不需要记命令行参数:
  #   .env 里写  COMPOSE_PROFILES=peer   → docker compose up -d 会起它
  #   .env 里不写这个变量               → 只起主服务(默认形态)
  #
  # 用 COMPOSE_PROFILES 而不是"服务总在 + 靠 env 判空": compose 没有条件
  # 启动语法, 硬做只能让容器起来再自己退出, 配合 restart: unless-stopped
  # 会变成反复重启 —— 比不起更糟。
  peer:
    profiles: ["peer"]
    image: erishen/lume-scanner
    container_name: lume-scanner-peer
    build: .
    restart: unless-stopped
    # 不发布到宿主: peer 面只给**其它 lume 应用**调用(见 lume-peer-net),
    # 不是给人用浏览器打开的 —— 一个端口两种语义必然混淆, 实际踩过。
    expose:
      - "18103"
    volumes:
      # 与主服务同一份行情库, 只读 —— peer 面不开写, 也不该触发重算。
      - ${STOCKANALYZER_DATA:-.data}:/app/data:ro
      # 节点注册表(热改不用重启)。挂在 .data 之外: 这里 .data 并未整卷
      # 只读挂载, 但仍分开, 免得 peer 面的白名单和业务数据混在一起。
      - ./.data/peers-identity.json:/app/peer-identity/peers-identity.json:ro
    environment:
      # 必须 0.0.0.0: Docker 端口转发从容器 eth0 进来, 绑回环会让 -p 失效。
      LUME_BIND: "0.0.0.0"
      PEER_NAME: "${PEER_NAME:-scanner}"
      PEER_PORT: "18103"
      PEER_SHARED: "${PEER_SHARED:?peer 已默认开启, 请在 .env 配 PEER_SHARED(与访问方一致); 不想开就注释掉 COMPOSE_PROFILES=peer}"
      PEER_ROOT: "${PEER_ROOT:-}"
      PEER_SITE_NAME: "lume-scanner"
      PEER_REGISTRY: "/app/peer-identity/peers-identity.json"
      # 行情库位置(与主服务一致)
      SCANNER_DB: /app/data/stock_analysis.db
      ASSET_DB: /app/data/asset_snapshot.db
      # 关掉 MCP 加载: peer 只用 repo.* 的只读查询, 不碰 MCP;
      # 而镜像里的 mcp-servers 靠 npx 启, 容器内没有 node, 会刷握手失败。噪音。
      MCP_ALLOW: "__none__"
    command: ["/usr/local/bin/lume", "peer_node.lume"]
    # 全用 map 形式: list 形式与本段的 map 键混用会让 YAML 解析器报错。
    networks:
      default: {}
      # 带别名: 各应用的服务名都叫 "peer", 共享网里必须唯一(DNS 重名只会
      # 解析到其中一个, 访问谁全看运气)。看板按 "scanner-peer" 连接。
      lume-peer-net:
        aliases:
          - scanner-peer

networks:
  # 预先创建一次: docker network create lume-peer-net
  lume-peer-net:
    external: true
